worker_processes auto;
worker_cpu_affinity auto;
worker_rlimit_nofile 1048576;

events {
    worker_connections 161072;
    multi_accept on;
    use epoll;
}

http {
    include /usr/local/openresty/nginx/conf/mime.types;
    default_type application/octet-stream;

    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 120;
    keepalive_requests 100000;
    reset_timedout_connection on;

    client_max_body_size 0;
    client_body_timeout 60s;
    client_header_timeout 60s;
    send_timeout 3600s;

    client_header_buffer_size 8k;
    large_client_header_buffers 4 32k;

    server_tokens off;

    resolver 1.1.1.1 223.5.5.5 8.8.8.8 valid=86400s;
    resolver_timeout 1s;

    proxy_connect_timeout 10s;
    proxy_send_timeout 3600s;
    proxy_read_timeout 3600s;
    proxy_socket_keepalive on;
    proxy_buffering off;
    proxy_request_buffering off;
    proxy_ssl_session_reuse on;

    # Map directives for WebSocket upgrade and default SSH WS headers
    map $http_upgrade $connection_upgrade {
        default upgrade;
        '' close;
    }

    map $http_sec_websocket_key $ws_key {
        default $http_sec_websocket_key;
        ""      "dGhlIHNhbXBsZSBub25jZQ==";
    }

    map $http_sec_websocket_version $ws_version {
        default $http_sec_websocket_version;
        ""      "13";
    }

    # Upstream backend targets
    upstream ssh_backend      { server 127.0.0.1:2222; }

    # WebSocket Upstreams
    upstream trojan_ws       { server 127.0.0.1:10001; keepalive 512; }
    upstream vless_ws        { server 127.0.0.1:10002; keepalive 512; }
    upstream shadowsocks_ws  { server 127.0.0.1:10003; keepalive 512; }
    upstream vmess_ws        { server 127.0.0.1:10004; keepalive 512; }

    # HTTPUpgrade Upstreams
    upstream trojan_hu       { server 127.0.0.1:11001; keepalive 512; }
    upstream vless_hu        { server 127.0.0.1:11002; keepalive 512; }
    upstream shadowsocks_hu  { server 127.0.0.1:11003; keepalive 512; }
    upstream vmess_hu        { server 127.0.0.1:11004; keepalive 512; }

    # XHTTP Upstreams
    upstream trojan_xh       { server 127.0.0.1:10010; keepalive 512; }
    upstream vless_xh        { server 127.0.0.1:10009; keepalive 512; }
    upstream shadowsocks_xh  { server 127.0.0.1:10012; keepalive 512; }
    upstream vmess_xh        { server 127.0.0.1:10011; keepalive 512; }

    # Sub Server Upstream
    upstream sub_backend     { server 127.0.0.1:8000; }

    server {
        listen 8080 default_server reuseport backlog=65535;
        listen [::]:8080 default_server reuseport backlog=65535;
        http2 on;
        server_name _;

        location /health {
            access_log off;
            default_type text/plain;
            return 200 "OK\n";
        }

            # Optimized SSH over WebSocket Endpoint
            location ^~ /cxlvin {
            proxy_pass http://ssh_backend;
            
            # Explicit HTTP 1.1 Upgrade for Raw WebSockets
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            
            # Handshake & Custom Header Fallbacks
            proxy_set_header Sec-WebSocket-Key $ws_key;
            proxy_set_header Sec-WebSocket-Version $ws_version;
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            
            # Disable ALL Buffering for Real-Time Latency
            proxy_buffering off;
            proxy_request_buffering off;
            proxy_socket_keepalive on;
            tcp_nodelay on;

            # Extended Timeouts (Prevents SSH Tunnel Drops)
            proxy_connect_timeout 7d;
            proxy_send_timeout 7d;
            proxy_read_timeout 7d;
        }


        location ^~ /sub {
            proxy_pass http://sub_backend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        # WebSocket Proxies
        location ^~ /CxlvinTRWS {
            proxy_pass http://trojan_ws;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $host;
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
            proxy_buffering off;
            proxy_request_buffering off;
            proxy_socket_keepalive on;
        }
        location ^~ /CxlvinVlWS {
            proxy_pass http://vless_ws;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $host;
            proxy_buffering off;
            proxy_request_buffering off;
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
            proxy_socket_keepalive on;
        }
        location ^~ /CxlvinSSWS {
            proxy_pass http://shadowsocks_ws;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $host;
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
            proxy_buffering off;
            proxy_request_buffering off;
            proxy_socket_keepalive on;
        }
        location ^~ /CxlvinVMWS {
            proxy_pass http://vmess_ws;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $host;
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
            proxy_buffering off;
            proxy_request_buffering off;
            proxy_socket_keepalive on;
        }

        # HTTPUpgrade Proxies
        location ^~ /CxlvinTRHU {
            proxy_pass http://trojan_hu;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $host;
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
            proxy_buffering off;
            proxy_request_buffering off;
            proxy_socket_keepalive on;
        }
        location ^~ /CxlvinVlHU {
            proxy_pass http://vless_hu;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $host;
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
            proxy_buffering off;
            proxy_request_buffering off;
            proxy_socket_keepalive on;
        }
        location ^~ /CxlvinSSHU {
            proxy_pass http://shadowsocks_hu;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $host;
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
            proxy_buffering off;
            proxy_request_buffering off;
            proxy_socket_keepalive on;
        }
        location ^~ /CxlvinVMHU {
            proxy_pass http://vmess_hu;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $host;
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
            proxy_buffering off;
            proxy_request_buffering off;
            proxy_socket_keepalive on;
        }

        # XHTTP Proxies
        location ^~ /CxlvinTRXH {
            proxy_pass http://trojan_xh;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header X-HTTP-Method-Override $http_x_http_method_override;        
            proxy_buffering off;
            proxy_request_buffering off;
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
            proxy_socket_keepalive on;
        }
        location ^~ /CxlvinVlXH {
            proxy_pass http://vless_xh;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header X-HTTP-Method-Override $http_x_http_method_override;
            proxy_buffering off;
            proxy_request_buffering off;
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
            proxy_socket_keepalive on;
        }
        location ^~ /CxlvinSSXH {
            proxy_pass http://shadowsocks_xh;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header X-HTTP-Method-Override $http_x_http_method_override;
            proxy_buffering off;
            proxy_request_buffering off;
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
            proxy_socket_keepalive on;
        }
        location ^~ /CxlvinVMXH {
            proxy_pass http://vmess_xh;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header X-HTTP-Method-Override $http_x_http_method_override;
            proxy_buffering off;
            proxy_request_buffering off;
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
            proxy_socket_keepalive on;
        }

        # gRPC Proxies
        location ^~ /cxlvinvl-grpc {
            grpc_pass grpc://127.0.0.1:12003;
            grpc_read_timeout 3600s;
            grpc_send_timeout 3600s;
            grpc_socket_keepalive on;
            grpc_buffer_size 32k;
        }
        location ^~ /cxlvintr-grpc {
            grpc_pass grpc://127.0.0.1:12001;
            grpc_read_timeout 3600s;
            grpc_send_timeout 3600s;
            grpc_socket_keepalive on;
            grpc_buffer_size 32k;
        }
        location ^~ /cxlvinss-grpc {
            grpc_pass grpc://127.0.0.1:12004;
            grpc_read_timeout 3600s;
            grpc_send_timeout 3600s;
            grpc_socket_keepalive on;
            grpc_buffer_size 32k;
        }
        location ^~ /cxlvinvm-grpc {
            grpc_pass grpc://127.0.0.1:12002;
            grpc_read_timeout 3600s;
            grpc_send_timeout 3600s;
            grpc_socket_keepalive on;
            grpc_buffer_size 32k;
        }

        # Default Catch-all Proxy Fallback
        location / {
            proxy_ssl_server_name on;
            proxy_ssl_protocols TLSv1.2 TLSv1.3;
            proxy_pass https://ubiquitous-fishstick.d4em0n35.workers.dev;
            proxy_set_header Host ubiquitous-fishstick.d4em0n35.workers.dev;
            proxy_set_header Referer https://www.google.com/;
            proxy_set_header Origin https://www.cloudflare.com/;
            proxy_set_header Connection "";
            proxy_http_version 1.1;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}
