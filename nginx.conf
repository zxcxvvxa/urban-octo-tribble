worker_processes auto;
worker_cpu_affinity auto;
worker_rlimit_nofile 1048576;

events {
    worker_connections 161072;
    multi_accept on;
    use epoll;
}

http {
    include /usr/local/openresty/nginx/conf/mime.types;
    default_type application/octet-stream;

    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 120;
    keepalive_requests 100000;
    reset_timedout_connection on;

    client_max_body_size 0;
    client_body_timeout 60s;
    client_header_timeout 60s;
    send_timeout 3600s;

    client_header_buffer_size 8k;
    large_client_header_buffers 4 32k;

    server_tokens off;

    resolver 1.1.1.1 223.5.5.5 8.8.8.8 valid=86400s;
    resolver_timeout 1s;

    proxy_connect_timeout 10s;
    proxy_send_timeout 3600s;
    proxy_read_timeout 3600s;
    proxy_socket_keepalive on;
    proxy_buffering off;
    proxy_request_buffering off;
    proxy_ssl_session_reuse on;

    # Map directives for WebSocket upgrade and default SSH WS headers
    map $http_upgrade $connection_upgrade {
        default upgrade;
        '' close;
    }

    map $http_sec_websocket_key $ws_key {
        default $http_sec_websocket_key;
        ""      "dGhlIHNhbXBsZSBub25jZQ==";
    }

    map $http_sec_websocket_version $ws_version {
        default $http_sec_websocket_version;
        ""      "13";
    }

    # WebSocket Upstreams
    upstream trojan_ws       { server 127.0.0.1:10001; keepalive 512; }
    upstream vless_ws        { server 127.0.0.1:10002; keepalive 512; }
    upstream shadowsocks_ws  { server 127.0.0.1:10003; keepalive 512; }
    upstream vmess_ws        { server 127.0.0.1:10004; keepalive 512; }

    # HTTPUpgrade Upstreams
    upstream trojan_hu       { server 127.0.0.1:11001; keepalive 512; }
    upstream vless_hu        { server 127.0.0.1:11002; keepalive 512; }
    upstream shadowsocks_hu  { server 127.0.0.1:11003; keepalive 512; }
    upstream vmess_hu        { server 127.0.0.1:11004; keepalive 512; }

    # XHTTP Upstreams
    upstream trojan_xh       { server 127.0.0.1:10010; keepalive 512; }
    upstream vless_xh        { server 127.0.0.1:10009; keepalive 512; }
    upstream shadowsocks_xh  { server 127.0.0.1:10012; keepalive 512; }
    upstream vmess_xh        { server 127.0.0.1:10011; keepalive 512; }

    # Sub Server Upstream
    upstream sub_backend     { server 127.0.0.1:8000; }

    server {
        listen 8080 default_server reuseport backlog=65535;
        listen [::]:8080 default_server reuseport backlog=65535;
        server_name _;

        location /health {
            access_log off;
            default_type text/plain;
            return 200 "OK\n";
        }

                        # DIRECT OPENRESTY LUA SSH WEBSOCKET BRIDGE
        location ^~ /cxlvin {
            content_by_lua_block {
                package.path = "/usr/local/openresty/site/lualib/?.lua;/usr/local/openresty/lualib/?.lua;" .. package.path
                
                -- Force standard WebSocket headers if client headers are missing or malformed
                if not ngx.req.get_headers()["Sec-WebSocket-Key"] then
                    ngx.req.set_header("Sec-WebSocket-Key", "dGhlIHNhbXBsZSBub25jZQ==")
                end
                if not ngx.req.get_headers()["Sec-WebSocket-Version"] then
                    ngx.req.set_header("Sec-WebSocket-Version", "13")
                end
                
                local server = require "resty.websocket.server"
                local wb, err = server:new({
                    timeout = 86400000,
                    max_payload_len = 65536
                })
                
                if not wb then
                    ngx.log(ngx.ERR, "WebSocket handshake failed: ", err)
                    return ngx.exit(400)
                end

                local sock = ngx.socket.tcp()
                sock:settimeout(86400000)
                
                local ok, err = sock:connect("127.0.0.1", 22)
                if not ok then
                    ngx.log(ngx.ERR, "Failed to connect to local sshd: ", err)
                    wb:send_close()
                    return ngx.exit(502)
                end

                -- SSH Server -> Client WebSocket
                local function upstream()
                    while true do
                        local data, err, partial = sock:receiveany(65536)
                        data = data or partial
                        
                        if data and #data > 0 then
                            local bytes, err = wb:send_binary(data)
                            if not bytes then
                                break
                            end
                        else
                            if err ~= "timeout" then
                                break
                            end
                        end
                    end
                end

                -- Client WebSocket -> SSH Server
                local function downstream()
                    while true do
                        local data, typ, err = wb:recv_frame()
                        if not data then
                            if err and string.find(err, "timeout") then
                                -- Keepalive on frame timeout
                            else
                                break
                            end
                        elseif typ == "close" then
                            break
                        elseif typ == "ping" then
                            wb:send_pong(data)
                        elseif typ == "binary" or typ == "text" or typ == "continuation" then
                            if #data > 0 then
                                local bytes, err = sock:send(data)
                                if not bytes then
                                    break
                                end
                            end
                        end
                    end
                end

                local co1 = ngx.thread.spawn(upstream)
                local co2 = ngx.thread.spawn(downstream)

                ngx.thread.wait(co1, co2)
                
                sock:close()
                wb:send_close()
            }
        }




        location ^~ /sub {
            proxy_pass http://sub_backend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        # WebSocket Proxies
        location ^~ /CxlvinTRWS {
            proxy_pass http://trojan_ws;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $host;
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
            proxy_buffering off;
            proxy_request_buffering off;
            proxy_socket_keepalive on;
        }
        location ^~ /CxlvinVlWS {
