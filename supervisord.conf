[supervisord]
nodaemon=true
user=root
logfile=/var/log/supervisord.log
pidfile=/var/run/supervisord.pid
loglevel=info

[program:sshd]
command=/usr/sbin/sshd -D
user=root
autostart=true
autorestart=true
startretries=5
startsecs=2
stdout_logfile=/proc/1/fd/1
stderr_logfile=/proc/1/fd/2
stdout_logfile_maxbytes=0
stderr_logfile_maxbytes=0
priority=10

[program:wsproxy]
command=python3 /app/wsproxy.py
user=root
directory=/app
autostart=true
autorestart=true
startretries=5
stdout_logfile=/proc/1/fd/1
stderr_logfile=/proc/1/fd/2
stdout_logfile_maxbytes=0
stderr_logfile_maxbytes=0
priority=15

[program:xray]
command=/usr/local/bin/xray run -c /etc/xray.json
user=root
autostart=true
autorestart=true
startretries=10
startsecs=5
stdout_logfile=/proc/1/fd/1
stderr_logfile=/proc/1/fd/2
stdout_logfile_maxbytes=0
stderr_logfile_maxbytes=0
priority=20

[program:badvpn]
command=badvpn-udpgw --listen-addr 127.0.0.1:7300 --max-clients 1000 --max-connections-for-client 40 --loglevel warning
user=root
autostart=true
autorestart=true
startretries=5
stdout_logfile=/proc/1/fd/1
stderr_logfile=/proc/1/fd/2
stdout_logfile_maxbytes=0
stderr_logfile_maxbytes=0
priority=30

[program:sub_server]
command=python3 /app/sub_server.py
user=root
directory=/app
autostart=true
autorestart=true
startretries=5
stdout_logfile=/proc/1/fd/1
stderr_logfile=/proc/1/fd/2
stdout_logfile_maxbytes=0
stderr_logfile_maxbytes=0
priority=35

[program:anti_ddos]
command=python3 /app/anti_ddos.py
user=root
directory=/app
autostart=true
autorestart=true
startretries=5
stdout_logfile=/proc/1/fd/1
stderr_logfile=/proc/1/fd/2
stdout_logfile_maxbytes=0
stderr_logfile_maxbytes=0
priority=40

[program:log_cleaner]
command=python3 /app/log_cleaner.py
user=root
directory=/app
autostart=true
autorestart=true
startretries=5
stdout_logfile=/proc/1/fd/1
stderr_logfile=/proc/1/fd/2
stdout_logfile_maxbytes=0
stderr_logfile_maxbytes=0
priority=45

[program:openresty]
command=/usr/local/openresty/bin/openresty -g 'daemon off;'
user=root
autostart=true
autorestart=true
startretries=5
startsecs=3
stdout_logfile=/proc/1/fd/1
stderr_logfile=/proc/1/fd/2
stdout_logfile_maxbytes=0
stderr_logfile_maxbytes=0
priority=50
